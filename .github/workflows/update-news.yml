name: تحديث الأخبار

# الجدولة الأسبوعية تعمل الآن من جهاز أحمد (scripts/update_news.ps1 عبر Task Scheduler)
# لأن Actions متوقّف على الحساب. يبقى التشغيل اليدوي متاحاً عند عودة Actions.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: سحب الأخبار من المصادر الرسمية
        run: python scripts/fetch_news.py

      - name: حفظ التحديث إن تغيّر
        run: |
          if git diff --quiet -- news.json; then
            echo "لا جديد — لا حاجة للحفظ"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "chore: تحديث الأخبار تلقائياً"
          git push
